<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StarFall</title>
    <link rel="stylesheet" href="Starfall.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#top" aria-label="StarFall home">
            <span class="brand-mark">✦</span>
            <span>STAR<span>FALL</span></span>
        </a>
        <div class="header-status"><span class="status-dot"></span><span>ONLINE ARCADE</span></div>
    </header>

    <main id="top">
        <section class="hero">
            <div class="hero-copy">
                <p class="eyebrow">WELCOME, TRAVELER</p>
                <h1>Find your next<br><em>adventure.</em></h1>
                <p class="hero-text">A little corner of the universe for curious minds.<br>Stay awhile and find your way among the stars.</p>
                <a class="primary-button" href="#about">EXPLORE <span>→</span></a>
            </div>
            <div class="hero-orbit" aria-hidden="true">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="planet"><span>✦</span></div>
                <span class="floating-star star-a">✦</span>
                <span class="floating-star star-b">✧</span>
                <span class="floating-star star-c">·</span>
            </div>
        </section>

        <section class="intro-section" id="about">
            <p class="eyebrow">A PLACE TO BEGIN</p>
            <h2>Something wonderful<br>is <em>on the horizon.</em></h2>
        </section>
    </main>

    <footer id="contact"><span>STARFALL</span><span>© 2024 · MADE FOR THE NIGHT OWLS</span></footer>
</body>
</html>
