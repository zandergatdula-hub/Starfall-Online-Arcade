<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover your next adventure at StarFall, a corner of the universe for games.">
    <title>StarFall | Online Arcade</title>
    <link rel="stylesheet" href="Starfall.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="#top" aria-label="StarFall home">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>STAR<span class="brand-accent">FALL</span></span>
        </a>

        <div class="header-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span>ONLINE ARCADE</span>
        </div>
    </header>

    <main id="top">
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <p class="eyebrow">WELCOME, TRAVELER</p>
                <h1 id="hero-title">Find your next<br><em>adventure.</em></h1>
                <p class="hero-text">
                    A little corner of the universe for exploring new games.<br>
                    Allow yourselves to get lost in the fun.
                </p>
                <a class="primary-button" href="#about">EXPLORE <span aria-hidden="true">→</span></a>
            </div>

            <div class="hero-orbit" aria-hidden="true">
                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>
                <div class="planet">✦</div>
                <span class="floating-star star-a">✦</span>
                <span class="floating-star star-b">✧</span>
                <span class="floating-star star-c">·</span>
            </div>
        </section>

        <section class="intro-section" id="about" aria-labelledby="intro-title">
            <p class="eyebrow">A PLACE TO BEGIN</p>
            <h2 id="intro-title">A journey of fun<br>begins <em>here!</em></h2>
        </section>
    </main>

    <footer id="contact">
        <span>STARFALL</span>
        <span>© 2026 · MADE FOR THE NIGHT OWLS</span>
    </footer>
</body>
</html>
